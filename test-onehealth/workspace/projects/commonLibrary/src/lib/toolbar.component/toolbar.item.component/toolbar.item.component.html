<button
  *ngIf="type === 'lg'"
  oh-button
  ohType="text"
  class="toolbar-btn"
  title="{{ title }}"
>
  <i
    oh-icon
    [ohSrc]="iconfont ? '' : (icon | assetUrl)"
    [ohType]="iconfont ? icon : ''"
    [ohSize]="'lg'"
  ></i
  ><span>{{ title }}</span>
</button>
