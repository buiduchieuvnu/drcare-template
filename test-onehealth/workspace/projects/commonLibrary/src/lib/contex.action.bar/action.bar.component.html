<oh-affix *ngIf="fixAtTop; else elseFixAtTop" [ohOffsetTop]="fixAtTop">
  <div
    oh-row
    class="context-actionbar-wrapper"
    [ngStyle]="{ 'background-color': bgColor ? bgColor : '' }"
  >
    <div
      oh-col
      ohXs="14"
      ohSm="14"
      ohMd="14"
      ohLg="18"
      ohXl="18"
      class="actionbar-left"
    >
      <ng-container *ngTemplateOutlet="left"></ng-container>
    </div>
    <div
      oh-col
      ohXs="10"
      ohSm="10"
      ohMd="10"
      ohLg="6"
      ohXl="6"
      style="text-align: right"
      class="actionbar-right"
    >
      <ng-container *ngTemplateOutlet="right"></ng-container>
    </div>
  </div>
</oh-affix>
<ng-template #elseFixAtTop>
  <oh-affix *ngIf="fixAtBottom; else default" [ohOffsetBottom]="fixAtBottom">
    <div oh-row class="context-actionbar-wrapper">
      <div
        oh-col
        ohXs="14"
        ohSm="14"
        ohMd="14"
        ohLg="18"
        ohXl="18"
        class="actionbar-left"
      >
        <ng-container *ngTemplateOutlet="left"></ng-container>
      </div>
      <div
        oh-col
        ohXs="10"
        ohSm="10"
        ohMd="10"
        ohLg="6"
        ohXl="6"
        style="text-align: right"
        class="actionbar-right"
      >
        <ng-container *ngTemplateOutlet="right"></ng-container>
      </div>
    </div>
  </oh-affix>
</ng-template>

<ng-template #default>
  <oh-affix [ohOffsetTop]="85">
    <div oh-row class="context-actionbar-wrapper">
      <div
        oh-col
        ohXs="14"
        ohSm="14"
        ohMd="14"
        ohLg="18"
        ohXl="18"
        class="actionbar-left"
      >
        <ng-container *ngTemplateOutlet="left"></ng-container>
      </div>
      <div
        oh-col
        ohXs="10"
        ohSm="10"
        ohMd="10"
        ohLg="6"
        ohXl="6"
        style="text-align: right"
        class="actionbar-right"
      >
        <ng-container *ngTemplateOutlet="right"></ng-container>
      </div>
    </div>
  </oh-affix>
</ng-template>
