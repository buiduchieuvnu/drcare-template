<button
  *ngIf="text; else notext"
  oh-button
  ohType="text"
  oh-tooltip
  [ohTooltipTitle]="title"
  [disabled]="disabled"
  class="action-item-btn"
>
  <i
    *ngIf="iconSrc; else elseSrc"
    oh-icon
    [ohSrc]="iconSrc"
    [ohColor]="color"
  ></i>
  <ng-template #elseSrc>
    <i *ngIf="icon" oh-icon [ohType]="icon" [ohColor]="color"></i>
  </ng-template>
  <span>{{ text }}</span>
</button>
<ng-template #notext>
  <button
    oh-button
    ohType="text"
    oh-tooltip
    [ohTooltipTitle]="title"
    [disabled]="disabled"
    class="action-item-btn"
  >
    <i
      *ngIf="iconSrc; else elseSrc"
      oh-icon
      [ohSrc]="iconSrc"
      [ohColor]="color"
    ></i>
    <ng-template #elseSrc>
      <i *ngIf="icon" oh-icon [ohType]="icon" [ohColor]="color"></i>
    </ng-template>
  </button>
</ng-template>
