<div class="side-bar" [class.collapsed]="!isPinned" [class.expanded]="isPinned" (mouseenter)="onHover(true)"
  (mouseleave)="onHover(false)">
  <div class="redirect">
    <a *ngIf="!isHover && !isPinned" href="/admin" class="redirect-icon">
      <span oh-icon ohType="arrow-left" ohTheme="outline"></span>
      <span class="mini-text">His</span>
    </a>

    <!-- Khi hover HOẶC pin -->
    <a *ngIf="isHover || isPinned" href="/his" class="redirect-text">
      Chuyển trang His
    </a>
  </div>
  <div class="title">
    <h3>ADMIN</h3>
  </div>

  <div class="his-side-bar">
    <his-side-bar [hisSideBarConfig]="hisSideBarConfig" [hisInlineCollapsed]="!isPinned && !isHover" [hisHover]="false"
      [class.collapsed]="!isPinned" [class.expanded]="isPinned"></his-side-bar>
  </div>

</div>
<button class="pin-btn" [class.sidebar-hover]="isHover" [class.sidebar-pinned]="isPinned" (click)="togglePin()">
  <span oh-icon ohType="menu" ohTheme="outline"></span>
</button>
