<div #toolbarCtn class="toobar-container">
  <div
    #toolbarWrp
    oh-row
    [ngClass]="{ 'toolbar-wrapper': true, collapse: isCollapse }"
    [ngStyle]="{ 'background-color': bgColor ? bgColor : '' }"
  >
    <div *ngIf="screenSize" oh-col [ohSpan]="24">
      <ng-container
        *ngFor="let item of config.slice(0, sliceNum); let i = index"
      >
        <toolbar-item
          *ngIf="item.title || item.icon"
          [title]="item.title"
          [icon]="item.icon"
          [iconfont]="item.iconfont"
          [type]="isCollapse ? 'sm' : 'md'"
          (click)="onItemClick(item)"
        ></toolbar-item>
        <oh-divider
          *ngIf="!item.title && !item.icon && screenSize > 992"
          ohType="vertical"
        ></oh-divider>
      </ng-container>
      <ng-content></ng-content>
      <button
        *ngIf="config.length > sliceNum"
        oh-button
        ohType="text"
        class="toolbar-more-btn"
        oh-dropdown
        [ohDropdownMenu]="more"
      >
        <i oh-icon [ohType]="'more'" [ohSize]="'md'"></i>
      </button>
      <oh-dropdown-menu #more="ohDropdownMenu">
        <ul oh-menu ohSelectable>
          <li
            *ngFor="
              let item of config.slice(sliceNum, config.length);
              let i = index
            "
            oh-menu-item
            style="text-align: center"
          >
            <toolbar-item
              *ngIf="item.title || item.icon"
              [title]="item.title"
              [icon]="item.icon"
              [iconfont]="item.iconfont"
              [type]="isCollapse ? 'sm' : 'md'"
              (click)="onItemClick(item)"
            ></toolbar-item>
          </li>
        </ul>
      </oh-dropdown-menu>

      <button
        *ngIf="!isCollapse"
        oh-button
        ohType="text"
        class="toolbar-btn-collapse"
        title="Thu gọn"
        (click)="tonggleCollapse()"
      >
        <i oh-icon ohType="up" [ohSize]="'xs'" [ohColor]="'primary'"></i>
      </button>
      <button
        *ngIf="isCollapse"
        oh-button
        ohType="text"
        class="toolbar-btn-collapse"
        title="Mở rộng"
        (click)="tonggleCollapse()"
      >
        <i
          oh-icon
          ohType="down"
          [ohSize]="'xs'"
          [ohColor]="'primary'"
        ></i>
      </button>
    </div>
  </div>
</div>
